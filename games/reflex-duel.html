<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflex Duel</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="wrap"><div class="top"><a class="back" href="../index.html">← Shelf</a><h1>Reflex Duel</h1></div>
<div class="stage"><div class="hud" id="m">Press Start. Wait for green, then hit your key. First to 5 wins.</div><div id="box" style="height:180px;border-radius:12px;background:#2d2a5c;margin-bottom:12px"></div><div class="hud" id="sc"></div><button class="btn" id="p1" style="padding:24px 36px">P1: A</button> <button class="btn" id="p2" style="padding:24px 36px;background:#3de0d0;color:#14122b">P2: L</button><br><br><button class="btn" id="go" style="background:#ffd24a;color:#14122b">Start round</button></div>
</div><script src="../js/games.js"></script>
<script>
const m=document.getElementById('m'),box=document.getElementById('box'),S=document.getElementById('sc');
let st='idle',sc=[0,0],timer,t0;
const show=()=>S.textContent=`P1 ${sc[0]}  -  ${sc[1]} P2`;show();
function start(){if(st==='wait'||st==='go')return;st='wait';box.style.background='#ff5d73';m.textContent='Wait for green...';
 timer=setTimeout(()=>{st='go';box.style.background='#7dff7a';m.textContent='NOW!';t0=performance.now()},2000+Math.random()*3000)}
function point(p,msg){st='idle';box.style.background='#2d2a5c';sc[p]++;
 if(sc[p]>=5){msg+=` P${p+1} wins the match!`;sc=[0,0]}show();m.textContent=msg+' Press Start for the next round.'}
function press(p){if(st==='wait'){clearTimeout(timer);point(1-p,`P${p+1} jumped early.`)}
 else if(st==='go')point(p,`P${p+1} wins the round in ${Math.round(performance.now()-t0)} ms.`)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='a')press(0);if(k==='l')press(1)});
document.getElementById('p1').onpointerdown=()=>press(0);
document.getElementById('p2').onpointerdown=()=>press(1);
document.getElementById('go').onclick=start;
</script></body></html>
